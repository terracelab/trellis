<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-orders-title">
  <title id="tl-tile-orders-title">주문</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-orders-tile)"/>
  <defs>
    <linearGradient id="tl-tile-orders-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA29D"/>
