        <path d="M246 578h474v149H246z" fill="url(#tl-tile-materials-edge)"/>
        <path d="M246 578h449v123H246z" fill="url(#tl-tile-materials-white)"/>
        <path d="M695 578h25v149h-25z" fill="#8FA1B5"/>
      </g>
      <g>
        <path d="M271 442h474v149H271z" fill="url(#tl-tile-materials-edge)"/>
        <path d="M271 442h449v123H271z" fill="url(#tl-tile-materials-white)"/>
        <path d="M720 442h25v149h-25z" fill="#8FA1B5"/>
      </g>
      <g>
        <path d="M296 306h474v149H296z" fill="url(#tl-tile-materials-edge)"/>
        <path d="M296 306h449v123H296z" fill="url(#tl-tile-materials-white)"/>
        <path d="M745 306h25v149h-25z" fill="#8FA1B5"/>
