<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-approval-title">
  <title id="tl-tile-approval-title">전자결재</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-approval-tile)"/>
  <defs>
    <linearGradient id="tl-tile-approval-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#82F0D9"/>
      <stop offset=".5" stop-color="#34BEAD"/>
      <stop offset="1" stop-color="#138C92"/>
    </linearGradient>
    <radialGradient id="tl-tile-approval-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl-tile-approval-white" x1="310" y1="190" x2="695" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#CBD7E4"/>
    </linearGradient>
    <linearGradient id="tl-tile-approval-gold" x1="610" y1="600" x2="850" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF5B2"/>
      <stop offset=".35" stop-color="#FFD24F"/>
      <stop offset=".75" stop-color="#E69510"/>
      <stop offset="1" stop-color="#AF5703"/>
    </linearGradient>
    <filter id="tl-tile-approval-shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="8" dy="22" stdDeviation="22" flood-color="#12305A" flood-opacity=".3"/>
    </filter>
    <filter id="tl-tile-approval-small" x="-45%" y="-45%" width="200%" height="210%">
      <feDropShadow dx="4" dy="11" stdDeviation="10" flood-color="#193052" flood-opacity=".28"/>
    </filter>
    <filter id="tl-tile-approval-blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tl-tile-approval-clip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tl-tile-approval-clip)">
    <rect width="1024" height="1024" fill="url(#tl-tile-approval-light)"/>
    <ellipse cx="518" cy="827" rx="292" ry="56" fill="#102D60" opacity=".25" filter="url(#tl-tile-approval-blur)"/>
    <g transform="rotate(-8 500 515)" filter="url(#tl-tile-approval-shadow)">
      <path d="M313 263h392v529l-35-25-35 25-35-25-35 25-35-25-35 25-35-25-35 25-35-25-37 25V263Z" fill="url(#tl-tile-approval-white)"/>
      <g fill="#B8C7D6">
        <rect x="390" y="376" width="236" height="18" rx="9"/>
        <rect x="390" y="438" width="180" height="16" rx="8"/>
        <rect x="390" y="500" width="215" height="16" rx="8"/>
      </g>
      <circle cx="605" cy="642" r="67" fill="#51D7B9"/>
      <path d="m570 643 25 25 48-55" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(252 498) rotate(24 100 180)" filter="url(#tl-tile-approval-small)">
      <path d="M67 0h66v318l-33 65-33-65V0Z" fill="#FFFFFF"/>
      <path d="M67 54h66v264H67Z" fill="#187EA5"/>
      <path d="m67 318 33 65 33-65Z" fill="url(#tl-tile-approval-gold)"/>
