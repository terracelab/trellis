<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-doc-editor-title">
  <title id="tl-tile-doc-editor-title">문서작성</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-doc-editor-tile)"/>
  <defs>
    <linearGradient id="tl-tile-doc-editor-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6ADFF2"/>
      <stop offset=".5" stop-color="#2BAFCF"/>
      <stop offset="1" stop-color="#1473A6"/>
    </linearGradient>
    <radialGradient id="tl-tile-doc-editor-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl-tile-doc-editor-white" x1="310" y1="190" x2="695" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#CBD7E4"/>
    </linearGradient>
    <filter id="tl-tile-doc-editor-shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="8" dy="22" stdDeviation="22" flood-color="#12305A" flood-opacity=".3"/>
    </filter>
    <filter id="tl-tile-doc-editor-blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tl-tile-doc-editor-clip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tl-tile-doc-editor-clip)">
    <rect width="1024" height="1024" fill="url(#tl-tile-doc-editor-light)"/>
    <ellipse cx="518" cy="827" rx="292" ry="56" fill="#102D60" opacity=".25" filter="url(#tl-tile-doc-editor-blur)"/>
    <g filter="url(#tl-tile-doc-editor-shadow)">
      <path d="M344 314c-135 0-225 89-225 207s90 207 225 207 225-89 225-207-90-207-225-207Zm0 99c67 0 112 45 112 108s-45 108-112 108-112-45-112-108 45-108 112-108Z" fill="url(#tl-tile-doc-editor-white)"/>
      <rect x="614" y="340" width="282" height="88" rx="44" fill="url(#tl-tile-doc-editor-white)"/>
      <rect x="614" y="477" width="282" height="88" rx="44" fill="url(#tl-tile-doc-editor-white)"/>
      <rect x="614" y="614" width="282" height="88" rx="44" fill="url(#tl-tile-doc-editor-white)"/>
    </g>
  </g>
</svg>
