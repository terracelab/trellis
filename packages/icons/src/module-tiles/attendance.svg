<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-attendance-title">
  <title id="tl-tile-attendance-title">근태</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-attendance-tile)"/>
  <defs>
    <linearGradient id="tl-tile-attendance-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5FC8FF"/>
      <stop offset=".5" stop-color="#277FEA"/>
      <stop offset="1" stop-color="#1552C8"/>
    </linearGradient>
    <radialGradient id="tl-tile-attendance-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl-tile-attendance-white" x1="310" y1="190" x2="695" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#CBD7E4"/>
    </linearGradient>
    <filter id="tl-tile-attendance-shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="8" dy="22" stdDeviation="22" flood-color="#12305A" flood-opacity=".3"/>
    </filter>
    <filter id="tl-tile-attendance-small" x="-45%" y="-45%" width="200%" height="210%">
      <feDropShadow dx="4" dy="11" stdDeviation="10" flood-color="#193052" flood-opacity=".28"/>
    </filter>
    <filter id="tl-tile-attendance-blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tl-tile-attendance-clip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tl-tile-attendance-clip)">
    <rect width="1024" height="1024" fill="url(#tl-tile-attendance-light)"/>
    <ellipse cx="518" cy="827" rx="292" ry="56" fill="#102D60" opacity=".25" filter="url(#tl-tile-attendance-blur)"/>
    <g filter="url(#tl-tile-attendance-shadow)">
      <path d="M298 733c10-149 94-229 214-229s204 80 214 229c3 44-33 80-77 80H375c-44 0-80-36-77-80Z" fill="url(#tl-tile-attendance-white)"/>
      <circle cx="512" cy="349" r="133" fill="url(#tl-tile-attendance-white)"/>
      <path d="M409 326c25-82 94-122 163-95" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" opacity=".8"/>
    </g>
    <g transform="translate(622 602)" filter="url(#tl-tile-attendance-small)">
      <circle cx="104" cy="104" r="104" fill="#52D7C6"/>
      <circle cx="104" cy="104" r="77" fill="#E9FFFC"/>
      <path d="M104 60v51l38 25" fill="none" stroke="#179DA9" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
