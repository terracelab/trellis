<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-products-title">
  <title id="tl-tile-products-title">상품</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-products-tile)"/>
  <defs>
    <linearGradient id="tl-tile-products-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFA29D"/>
      <stop offset=".5" stop-color="#E5484D"/>
      <stop offset="1" stop-color="#A31A27"/>
    </linearGradient>
    <radialGradient id="tl-tile-products-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl-tile-products-white" x1="310" y1="190" x2="695" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#F5F8FC"/>
    </linearGradient>
    <linearGradient id="tl-tile-products-edge" x1="600" y1="250" x2="750" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E9EFF6"/>
      <stop offset=".55" stop-color="#BCC9D8"/>
      <stop offset="1" stop-color="#8FA1B5"/>
    </linearGradient>
    <filter id="tl-tile-products-blur" x="-30%" y="-100%" width="160%" height="300%">
