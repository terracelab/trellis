      <path d="m425 455 334-67v333l-334 68z" fill="url(#tl-tile-products-white)"/>
      <path d="m585 426 67 47" stroke="#C4CEDA" stroke-width="9" stroke-linecap="round"/>
      <path d="m644 449 96 30 14 107-88 30-42-100z" fill="#E5484D"/>
