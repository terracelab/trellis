<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-trade-title">
  <title id="tl-tile-trade-title">수출입</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-trade-tile)"/>
  <defs>
    <linearGradient id="tl-tile-trade-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFCE91"/>
      <stop offset=".5" stop-color="#F5A524"/>
      <stop offset="1" stop-color="#CD8600"/>
    </linearGradient>
    <radialGradient id="tl-tile-trade-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
