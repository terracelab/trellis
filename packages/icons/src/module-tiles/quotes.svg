<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-quotes-title">
  <title id="tl-tile-quotes-title">견적</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-quotes-tile)"/>
  <defs>
    <linearGradient id="tl-tile-quotes-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57D4CF"/>
      <stop offset=".5" stop-color="#1AA4A3"/>
      <stop offset="1" stop-color="#087477"/>
    </linearGradient>
    <radialGradient id="tl-tile-quotes-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tl-tile-quotes-white" x1="310" y1="190" x2="695" y2="820" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F5F8FC"/>
      <stop offset="1" stop-color="#CBD7E4"/>
    </linearGradient>
    <filter id="tl-tile-quotes-shadow" x="-35%" y="-35%" width="180%" height="190%">
      <feDropShadow dx="8" dy="22" stdDeviation="22" flood-color="#12305A" flood-opacity=".3"/>
    </filter>
    <filter id="tl-tile-quotes-blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tl-tile-quotes-clip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tl-tile-quotes-clip)">
    <rect width="1024" height="1024" fill="url(#tl-tile-quotes-light)"/>
    <ellipse cx="518" cy="827" rx="292" ry="56" fill="#102D60" opacity=".25" filter="url(#tl-tile-quotes-blur)"/>
    <g transform="rotate(-4 512 510)" filter="url(#tl-tile-quotes-shadow)">
      <path d="M301 188h422v645l-42-29-42 29-42-29-42 29-42-29-42 29-42-29-42 29-43-29-43 29V188Z" fill="url(#tl-tile-quotes-white)"/>
      <g fill="#A9BAC9">
        <rect x="379" y="318" width="266" height="18" rx="9"/>
        <rect x="379" y="375" width="194" height="16" rx="8"/>
        <rect x="379" y="614" width="266" height="17" rx="8.5"/>
        <rect x="379" y="670" width="211" height="17" rx="8.5"/>
      </g>
      <rect x="385" y="446" width="250" height="107" rx="32" fill="#26AAA5"/>
      <path d="M435 480v40M585 480v40M435 500h150" stroke="#EFFFFD" stroke-width="15" stroke-linecap="round"/>
      <path d="m478 463 32 74 34-74" fill="none" stroke="#EFFFFD" stroke-width="15" stroke-linejoin="round"/>
    </g>
  </g>
