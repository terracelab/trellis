        <rect x="-47" y="-258" width="94" height="114" rx="17" transform="rotate(72)" fill="url(#tl-tile-equipment-white)"/>
        <rect x="-47" y="-258" width="94" height="114" rx="17" transform="rotate(108)" fill="url(#tl-tile-equipment-white)"/>
