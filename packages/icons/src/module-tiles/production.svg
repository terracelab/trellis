    <ellipse cx="518" cy="827" rx="292" ry="56" fill="#102D60" opacity=".25" filter="url(#tl-tile-production-blur)"/>
    <g transform="rotate(-3 520 530)" filter="url(#tl-tile-production-shadow)">
