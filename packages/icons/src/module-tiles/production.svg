      <path d="M253 505v280h509v48H295c-39 0-70-31-70-70V520l28-15Z" fill="#BBC9D7"/>
      <g fill="#7E5BE8">
        <rect x="325" y="592" width="85" height="75" rx="16"/>
        <rect x="463" y="592" width="85" height="75" rx="16"/>
        <rect x="601" y="592" width="85" height="75" rx="16"/>
      </g>
      <path d="M318 438V222h95v165" fill="#E9EEF5"/>
