<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="tl-tile-agent-title">
  <title id="tl-tile-agent-title">에이전트</title>
  <rect width="1024" height="1024" rx="220" fill="url(#tl-tile-agent-tile)"/>
  <defs>
    <linearGradient id="tl-tile-agent-tile" x1="105" y1="65" x2="920" y2="965" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B8B0FF"/>
      <stop offset=".5" stop-color="#8A7AE7"/>
      <stop offset="1" stop-color="#5949B4"/>
    </linearGradient>
    <radialGradient id="tl-tile-agent-light" cx="0" cy="0" r="1" gradientTransform="translate(250 155) rotate(45) scale(710 650)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".5"/>
      <stop offset=".52" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tl-tile-agent-blur" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="tl-tile-agent-clip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
    <linearGradient id="tl-tile-agent-face" x1="210" y1="228" x2="413" y2="571" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F5F8FC"/>
    </linearGradient>
    <linearGradient id="tl-tile-agent-side" x1="515" y1="256" x2="622" y2="662" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EBF3F9"/>
      <stop offset="1" stop-color="#AEBDCE"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tl-tile-agent-clip)">
    <rect width="1024" height="1024" fill="url(#tl-tile-agent-light)"/>
    <ellipse cx="518" cy="827" rx="292" ry="56" fill="#5949B4" opacity=".25" filter="url(#tl-tile-agent-blur)"/>
    <g transform="rotate(-3 512 512)">
      <rect x="217" y="463" width="590" height="169" rx="27" fill="url(#tl-tile-agent-side)"/>
      <rect x="493" y="290" width="38" height="60" fill="url(#tl-tile-agent-side)"/>
      <circle cx="512" cy="268" r="37" fill="url(#tl-tile-agent-face)"/>
      <rect x="259" y="351" width="519" height="412" rx="100" fill="url(#tl-tile-agent-side)"/>
      <rect x="245" y="337" width="519" height="412" rx="100" fill="url(#tl-tile-agent-face)"/>
      <rect x="307" y="427" width="395" height="219" rx="65" fill="#DAE3EE"/>
      <rect x="382" y="487" width="45" height="91" rx="22.5" fill="#98A6BC"/>
      <rect x="582" y="487" width="45" height="91" rx="22.5" fill="#98A6BC"/>
    </g>
  </g>
</svg>
