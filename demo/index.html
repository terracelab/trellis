    <script>
      // 첫 페인트 전에 테마 · 밀도 · 접근성 설정을 정한다(깜빡임 방지).
      // 테마는 소개 사이트에서 고른 값(같은 주소에 묶여 나갈 때) → 데모에서 고른 값 → 기기 설정 순서로 따른다.
      // 접근성 속성 값은 TrellisProvider가 거는 값과 같다(src/settings.ts)
      (function () {
        var d = document.documentElement;
        var t = null,
          s = null,
          a = null;
        try {
          t = localStorage.getItem('trellis-site-theme') || localStorage.getItem('tl-demo-theme');
          s = localStorage.getItem('tl-demo-density');
          a = JSON.parse(localStorage.getItem('tl-demo-a11y') || 'null');
        } catch (e) {}
        d.dataset.theme =
          t === 'dark' || t === 'light'
            ? t
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        if (s) d.dataset.density = s;
        if (a && typeof a === 'object') {
          if (a.fontScale === '112' || a.fontScale === '125') d.dataset.fontScale = a.fontScale;
          if (a.contrast === true) d.dataset.contrast = 'high';
          if (a.focusRing === true) d.dataset.focus = 'strong';
          if (a.linkUnderline === true) d.dataset.links = 'underline';
          if (a.chartPalette === true) d.dataset.chart = 'cvd';
          if (a.motion === true) d.dataset.motion = 'reduce';
        }
      })();
    </script>
